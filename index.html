<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar using flex box</title>
</head>
<style>
    .logo{
        width: 40px;
        height: 20px;
        /* background-color: blue; */
    }
    nav{
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: beige;
        
    }
    nav img{
        align-items: center;
    }
    .right ul{ display: flex;}
    .right ul li{list-style: none;} 
    ul li{
        margin: 4px;
        padding: 10px;
    }
    .logo img{
      gap: 34px;
    }
</style>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo.png"width="140" alt="">
            </div>
            <div class="right">
                <ul>
                    <li>Products</li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>About Us</li>
                </ul>
            </div>
        </nav>
    </header>
    
</body>
</html>
