<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
</head>
<style>
    *{
       margin: 0;
       padding: 0;
       
    }
    header{
        position: sticky ;
        top: 0;

    }
    nav{

        height: 83px;
        background-color: pink;
        
        
    }
    .container{
        background-color: rgb(82, 189, 68);
        margin: 12px 34px;
       /* height: 322px;  */
        text-align: center;
        padding: 55px 23px;
    }
    .box1{
        background-color: palevioletred;
        height: 70vh;
        width: 45%;
        display: inline-block;
        margin: 0 12px;
        
    }
    .box2{
        background-color: blue;
      height: 70vh;  
      width: 45%; 
      display: inline-block;
margin: 0 12px;
       }
       .text-box{
        padding: 34px;
        border: 2px solid white;
        margin:  2vw 34vw;
        color: white;
        text-align: center;
        border-radius: 13px;
        font-size: 2em;
       }
       main{
        background-color: black;
       }
       footer{
        height: 100px;
        background-color: bisque;
       }
       .orange-box{
        height: 32px;
        width: 32px;
        background-color: orange;
        position: fixed;
        bottom: 12px;
        right: 23px;
        border-radius: 60px;
       }
</style>
<body>
    <header>
        <nav>
           
        </nav>
    </header>
    <main>
        <div class="container">
         <div class="box1"></div>
         <div class="box2"></div>
        </div>
        <div class="text-box">
            <p> Welcome to Sigma Web Dev Express
            </p>
        </div>
        <div class="orange-box"></div>
    </main>
    <footer>

    </footer>
</body>
</html>
