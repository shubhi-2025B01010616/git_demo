<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multicolour Website</title>
</head>
<style>
    /* :root{
        --primary-colour:#ec77ea94;
        --text-colour:white;
        --secondary-colour:#e0c0df94;
    } */
    :root{
        --primary-colour:#acefc694;
        --text-colour:rgb(25, 162, 52);
        --secondary-colour:#69aa7894;
       
    }
    body{
        background-color:var(--secondary-colour);
    }
    *{ 
        margin: 0; 
        padding: 0;
           font-family: "Poppins", sans-serif;
    }
    ul li{
        list-style: none;
        display: inline;
        font-weight:bolder;
        padding: 30px;
        color: var(--text-colour);
    }
    nav{background-color: var(--primary-colour);
        padding: 15px 0px;
    }
    ul li a{
        text-decoration: none;
        color: var(--text-colour);
    }
    
</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="\">Home</li></a>
                <li><a href="\">Serivce</li></a>
                <li><a href="\">About</li></a>
                <li><a href="\">Contact Us</li></a>
               
            </ul>
        </nav>
    </header>
</body>
</html>
